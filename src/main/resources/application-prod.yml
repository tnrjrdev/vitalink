# ===========================================================================
# Profile PROD - producao (AWS / containers)
# Todas as credenciais vem de variaveis de ambiente. Nada sensivel versionado.
# ===========================================================================
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  forward-headers-strategy: framework   # respeita X-Forwarded-* atras de ALB/Nginx

logging:
  level:
    root: WARN
    com.vitalink.platform: INFO
