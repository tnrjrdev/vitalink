# ===========================================================================
# Configuracao base (comum a todos os profiles).
# Profiles especificos: application-dev.yml, application-prod.yml, application-test.yml
# Profile ativo via SPRING_PROFILES_ACTIVE (default: dev)
# ===========================================================================
spring:
  application:
    name: medico-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema e responsabilidade exclusiva do Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: ${APP_MAX_FILE_SIZE:10MB}
      max-request-size: ${APP_MAX_REQUEST_SIZE:15MB}

server:
  port: ${APP_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
  compression:
    enabled: true

# --- Propriedades customizadas da aplicacao ---
app:
  jwt:
    secret: ${APP_JWT_SECRET:ZHVtbXktZGV2LXNlY3JldC1rZXktbXVzdC1iZS1hdC1sZWFzdC02NC1ieXRlcy1sb25nLWZvci1obWFjLXNoYTUxMg==}
    access-token-expiration-ms: ${APP_JWT_ACCESS_EXPIRATION_MS:900000}        # 15 min
    refresh-token-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000}   # 7 dias
    issuer: ${APP_JWT_ISSUER:medico-platform}
  admin:
    email: ${APP_ADMIN_EMAIL:admin@medico.com}
    password: ${APP_ADMIN_PASSWORD:ChangeMe@123}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  # --- Integracao AWS (desligada por padrao; app sobe no H2 sem credencial) ---
  aws:
    enabled: ${APP_AWS_ENABLED:false}
    region: ${APP_AWS_REGION:us-east-1}
    access-key: ${APP_AWS_ACCESS_KEY:}
    secret-key: ${APP_AWS_SECRET_KEY:}
    s3:
      bucket: ${APP_AWS_S3_BUCKET:vitalink-documents}
      presigned-url-expiration-minutes: ${APP_AWS_S3_PRESIGN_MINUTES:15}
    ses:
      from: ${APP_AWS_SES_FROM:no-reply@vitalink.com}
    sns:
      appointment-topic-arn: ${APP_AWS_SNS_APPOINTMENT_TOPIC_ARN:}
    sqs:
      consumer-enabled: ${APP_AWS_SQS_CONSUMER_ENABLED:false}
      appointment-queue-url: ${APP_AWS_SQS_APPOINTMENT_QUEUE_URL:}
      max-messages: ${APP_AWS_SQS_MAX_MESSAGES:10}
      wait-time-seconds: ${APP_AWS_SQS_WAIT_SECONDS:10}
      poll-delay-ms: ${APP_AWS_SQS_POLL_DELAY_MS:5000}

# --- Actuator: expoe apenas o essencial ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

# --- Swagger / OpenAPI ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# --- Logs estruturados ---
logging:
  level:
    root: INFO
    com.vitalink.platform: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [traceId=%X{traceId:-}] %logger{36} - %msg%n"
